<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Drop | Gateway</title>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --emerald: #10b981;
      --emerald-dark: #059669;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .drop-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #e5e7eb;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-nav:hover, .btn-nav:active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hero-card {
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 20px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hero-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .hero-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .hero-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.78rem;
      color: #9ca3af;
    }
    .files-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: 100%;
    }
    .drop-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: all 0.2s ease;
      position: relative;
    }
    .drop-card.card-type-apk {
      border-color: rgba(16, 185, 129, 0.3);
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
    }
    .drop-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drop-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .drop-badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drop-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .drop-size-badge {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 8px;
    }
    .drop-card-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      word-break: break-all;
      margin-top: 4px;
    }
    .drop-card-meta {
      font-size: 0.78rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drop-download-btn {
      width: 100%;
      height: 50px;
      min-height: 50px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.96rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .drop-download-btn:active {
      transform: scale(0.98);
      filter: brightness(0.92);
    }
    .btn-drop-apk {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    }
    .btn-drop-file {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
    }
    .drop-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .drop-delete-btn {
      width: 50px;
      min-width: 50px;
      height: 50px;
      border-radius: 14px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      padding: 0;
    }
    .drop-delete-btn:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }
    .drop-delete-btn:active {
      transform: scale(0.95);
      filter: brightness(0.9);
    }
    .empty-state {
      display: none;
      text-align: center;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 18px;
    }
    .spin-active {
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 185, 129, 0.95);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="drop-wrapper">
    <div class="top-bar">
      <a href="/" class="btn-nav" title="Back to Control Center" data-i18n-title="btnBackToDashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span data-i18n="btnBackToDashboard">Back to Dashboard</span>
      </a>
      <div class="top-actions">
        <button class="btn-nav" id="btnDropLang" onclick="toggleDropLang()">🌐 EN</button>
        <button class="btn-nav" id="btnDropRefresh" onclick="loadDropFiles(true)">
          <svg id="iconDropRefresh" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span data-i18n="btnRefreshFiles">Refresh List</span>
        </button>
      </div>
    </div>

    <div class="hero-card">
      <div class="hero-badge">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981;"></span>
        <span>Ready</span>
      </div>
      <h1 class="hero-title" data-i18n="mobileDropStandaloneTitle">Mobile Drop</h1>
      <p class="hero-desc" data-i18n="mobileDropStandaloneDesc">Download files and APKs directly to your device</p>
      <div class="hero-stats">
        <span id="dropStatsCount">0 files available</span>
        <span style="color: #6ee7b7; font-weight: 600;">OLED Fast Mode</span>
      </div>
    </div>

    <div id="dropFilesGrid" class="files-grid"></div>

    <div id="dropEmptyState" class="empty-state">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">📦</div>
      <div style="font-weight: 700; font-size: 1.1rem; color: #ffffff; margin-bottom: 6px;" data-i18n="mobileDropEmptyTitle">Mobile Drop is empty</div>
      <div style="font-size: 0.85rem; color: var(--text-muted); max-width: 380px; margin: 0 auto;" data-i18n="mobileDropEmptyDesc">Drop APKs or files into your Mobile Drop folder to download them on your phone.</div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const I18N = {
      en: {
        mobileDropStandaloneTitle: "Mobile Drop",
        mobileDropStandaloneDesc: "Download files and APKs directly to your device",
        mobileDropEmptyTitle: "Mobile Drop is empty",
        mobileDropEmptyDesc: "Drop APKs or files into your Mobile Drop folder to download them on your phone.",
        btnRefreshFiles: "Refresh List",
        btnDownloadApk: "Download APK",
        btnDownloadFile: "Download File",
        mobileDropFilesCount: "files available",
        btnBackToDashboard: "Back to Dashboard",
        mobileDropRefreshed: "File list updated."
      },
      es: {
        mobileDropStandaloneTitle: "Mobile Drop",
        mobileDropStandaloneDesc: "Descarga archivos y APKs directo a tu celular",
        mobileDropEmptyTitle: "Mobile Drop está vacío",
        mobileDropEmptyDesc: "Coloca APKs o archivos en tu carpeta Mobile Drop para descargarlos en tu teléfono.",
        btnRefreshFiles: "Actualizar lista",
        btnDownloadApk: "Descargar APK",
        btnDownloadFile: "Descargar Archivo",
        mobileDropFilesCount: "archivos disponibles",
        btnBackToDashboard: "Volver al Dashboard",
        mobileDropRefreshed: "Lista de archivos actualizada."
      }
    };
    let currentLang = localStorage.getItem('dashboard_lang') || 'en';
    let cachedFiles = [];

    function t(key, fallback = '') {
      const dict = I18N[currentLang] || I18N.en || {};
      return dict[key] || (I18N.en && I18N.en[key]) || fallback || key;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function applyI18n() {
      const dict = I18N[currentLang] || I18N.en || {};
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k]) el.innerText = dict[k];
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const k = el.getAttribute('data-i18n-title');
        if (dict[k]) el.title = dict[k];
      });
      const btnLang = document.getElementById('btnDropLang');
      if (btnLang) btnLang.innerText = currentLang === 'en' ? '🌐 EN' : '🌐 ES';

      if (cachedFiles.length > 0) {
        renderFiles(cachedFiles);
      }
    }

    function toggleDropLang() {
      currentLang = currentLang === 'en' ? 'es' : 'en';
      localStorage.setItem('dashboard_lang', currentLang);
      applyI18n();
    }

    function getDropFileType(file) {
      const ext = (file.extension || '').toLowerCase();
      if (ext === '.apk') return 'apk';
      if (['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.bmp'].includes(ext)) return 'image';
      if (['.pdf', '.txt', '.doc', '.docx', '.xls', '.xlsx', '.md', '.json', '.csv'].includes(ext)) return 'doc';
      if (['.zip', '.rar', '.7z', '.tar', '.gz'].includes(ext)) return 'archive';
      return 'file';
    }

    function renderCard(file) {
      const type = getDropFileType(file);
      const isApk = type === 'apk';
      const extClean = (file.extension || '').replace('.', '').toUpperCase() || 'FILE';

      let iconSvg = '';
      let boxBg = '';
      let boxColor = '';
      let boxBorder = '';
      let pillBg = '';
      let pillColor = '';
      let pillBorder = '';
      let btnClass = 'btn-drop-file';
      let btnLabel = t('btnDownloadFile', 'Download File');

      if (type === 'apk') {
        boxBg = 'rgba(16, 185, 129, 0.15)';
        boxColor = '#10b981';
        boxBorder = '1px solid rgba(16, 185, 129, 0.35)';
        pillBg = 'rgba(16, 185, 129, 0.2)';
        pillColor = '#34d399';
        pillBorder = '1px solid rgba(16, 185, 129, 0.4)';
        btnClass = 'btn-drop-apk';
        btnLabel = t('btnDownloadApk', 'Download APK');
        iconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v6c0 .83.67 1.5 1.5 1.5S5 16.33 5 15.5v-6C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v6c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-6c0-.83-.67-1.5-1.5-1.5zm-4.97-4.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.72 2.24 12.88 2 12 2s-1.72.24-2.64.63L7.88.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.3 1.3C6.67 3.23 5.3 5.43 5.08 8h13.84c-.22-2.57-1.59-4.77-3.39-5.84zM9 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>';
      } else if (type === 'image') {
        boxBg = 'rgba(168, 85, 247, 0.15)';
        boxColor = '#c084fc';
        boxBorder = '1px solid rgba(168, 85, 247, 0.35)';
        pillBg = 'rgba(168, 85, 247, 0.2)';
        pillColor = '#d8b4fe';
        pillBorder = '1px solid rgba(168, 85, 247, 0.4)';
        iconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
      } else if (type === 'doc') {
        boxBg = 'rgba(14, 165, 233, 0.15)';
        boxColor = '#38bdf8';
        boxBorder = '1px solid rgba(14, 165, 233, 0.35)';
        pillBg = 'rgba(14, 165, 233, 0.2)';
        pillColor = '#7dd3fc';
        pillBorder = '1px solid rgba(14, 165, 233, 0.4)';
        iconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
      } else if (type === 'archive') {
        boxBg = 'rgba(245, 158, 11, 0.15)';
        boxColor = '#fbbf24';
        boxBorder = '1px solid rgba(245, 158, 11, 0.35)';
        pillBg = 'rgba(245, 158, 11, 0.2)';
        pillColor = '#fde68a';
        pillBorder = '1px solid rgba(245, 158, 11, 0.4)';
        iconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
      } else {
        boxBg = 'rgba(148, 163, 184, 0.15)';
        boxColor = '#94a3b8';
        boxBorder = '1px solid rgba(148, 163, 184, 0.3)';
        pillBg = 'rgba(148, 163, 184, 0.2)';
        pillColor = '#cbd5e1';
        pillBorder = '1px solid rgba(148, 163, 184, 0.4)';
        iconSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>';
      }

      return '<div class="drop-card ' + (isApk ? 'card-type-apk' : '') + '">' +
        '<div>' +
          '<div class="drop-card-top">' +
            '<div class="drop-icon-box" style="background: ' + boxBg + '; color: ' + boxColor + '; border: ' + boxBorder + ';">' +
              iconSvg +
            '</div>' +
            '<div class="drop-badge-group">' +
              '<span class="drop-pill" style="background: ' + pillBg + '; color: ' + pillColor + '; border: ' + pillBorder + ';">' + extClean + '</span>' +
              '<span class="drop-size-badge">' + file.size + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="drop-card-name" title="' + file.name + '">' + file.name + '</div>' +
          '<div class="drop-card-meta">' +
            '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>' +
            '<span>' + file.updatedAt + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="drop-card-actions">' +
          '<a href="' + file.downloadUrl + '" download="' + file.name + '" class="drop-download-btn ' + btnClass + '" style="flex: 1;">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
            '<span>' + btnLabel + '</span>' +
          '</a>' +
          '<button type="button" class="drop-delete-btn" onclick="confirmDeleteDropFile(' + encodeURIComponent(JSON.stringify(file.name)) + ')" title="' + t('btnDeleteFile', 'Delete') + '" aria-label="' + t('btnDeleteFile', 'Delete') + '">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>' +
          '</button>' +
        '</div>' +
      '</div>';
    }

    async function confirmDeleteDropFile(encodedName) {
      let fileName = '';
      try {
        fileName = JSON.parse(decodeURIComponent(encodedName));
      } catch (e) {
        fileName = decodeURIComponent(encodedName);
      }
      if (!fileName) return;

      const confirmMsg = t('confirmDeleteFile', 'Are you sure you want to delete') + ' "' + fileName + '"?';
      if (!confirm(confirmMsg)) {
        return;
      }

      try {
        const res = await fetch('/api/drop/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: fileName })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(t('fileDeletedSuccess', 'File deleted successfully.'));
          await loadDropFiles(false);
        } else {
          alert((data && data.error) || t('fileDeleteError', 'Failed to delete file.'));
        }
      } catch (err) {
        console.error('Error deleting file:', err);
        alert(t('fileDeleteError', 'Failed to delete file.'));
      }
    }

    function renderFiles(files) {
      const grid = document.getElementById('dropFilesGrid');
      const empty = document.getElementById('dropEmptyState');
      const stats = document.getElementById('dropStatsCount');

      if (stats) {
        stats.textContent = files.length + ' ' + t('mobileDropFilesCount', 'files available');
      }

      if (!grid || !empty) return;

      if (files.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        grid.innerHTML = files.map(renderCard).join('');
      }
    }

    async function loadDropFiles(manual = false) {
      const icon = document.getElementById('iconDropRefresh');
      if (icon) icon.classList.add('spin-active');

      try {
        const res = await fetch('/api/drop/files');
        if (!res.ok) throw new Error('Status ' + res.status);
        const data = await res.json();
        cachedFiles = data.files || [];
        renderFiles(cachedFiles);
        if (manual) {
          showToast(t('mobileDropRefreshed', 'File list updated.'));
        }
      } catch (err) {
        console.error('Failed to load files:', err);
      } finally {
        if (icon) {
          setTimeout(() => icon.classList.remove('spin-active'), 500);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyI18n();
      loadDropFiles(false);
    });
  </script>
</body>
</html>
